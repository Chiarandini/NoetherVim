name: capability matrix

# Grades every language bundle against the eight checkpoints in the
# language-bundle contract: a language server attaches, treesitter parses,
# the formatter reformats, diagnostics appear, tests run, the debugger stops on
# a breakpoint, and the file and project both run.
#
# Two triggers, because there are two ways this can break.
#
# A change to a language bundle, to the shared run table, or to the LSP stack
# can break a checkpoint, so those paths run it on the pull request that made
# the change -- attributed to that change, while the author is looking. It is
# slow (it provisions Rust, Go, Python, a JDK, Node and LLVM, then a Mason
# package set), which is why it is path-filtered rather than universal:
# check.yml and docs.yml stay the fast gates every PR pays for.
#
# The matrix can also break with no commit at all. Every checkpoint depends on
# something outside this repository -- a plugin, a Mason package, a language
# server, a toolchain -- and all of them move. That is what the schedule is
# for, and weekly is the honest cadence for it: nightly on a repository whose
# dependencies change slower than that mostly re-verifies unchanged code and
# trains you to ignore the result.
on:
  pull_request:
    paths:
      - "lua/noethervim/bundles/languages/**"
      - "lua/noethervim/bundles/tools/debug.lua"
      - "lua/noethervim/bundles/tools/test.lua"
      - "lua/noethervim/bundles/tools/task-runner.lua"
      - "lua/noethervim/util/run.lua"
      - "lua/noethervim/util/mason_install.lua"
      - "lua/noethervim/plugins/lsp.lua"
      - "lua/noethervim/lsp/**"
      - "tests/capability*"
      - "tests/fixtures/lang/**"
      - ".github/workflows/capability.yml"
  schedule:
    # Mondays 04:00 UTC: a drift canary, not a per-change gate.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      language:
        description: "One language (rust, go, python, c, java, web, latex) or --all"
        required: false
        default: "--all"

concurrency:
  group: capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: language capability matrix
    runs-on: ubuntu-latest
    # The budget is dominated by provisioning, not by the checks.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Each language brings its own toolchain. A missing one is reported as
      # UNCOVERED rather than FAIL, so a provisioning failure here degrades the
      # run honestly instead of turning it red for the wrong reason -- but the
      # point of installing them is that UNCOVERED should stay empty.
      - name: Rust toolchain
        run: rustup component add rust-analyzer rustfmt

      - uses: actions/setup-go@v5
        with: { go-version: "stable" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: C, CMake, Maven and the rest
        run: |
          sudo apt-get update
          # maven is what neotest-java builds and runs through; the java row's
          # test cell needs it, and the toolchain gate is on `java`, so its
          # absence would read as a failure rather than as UNCOVERED.
          sudo apt-get install -y build-essential cmake clangd maven
          # The tree-sitter CLI is what nvim-treesitter builds parsers with,
          # and core disables parser installation without it. Not an apt
          # package; npm is the supported route.
          npm install -g tree-sitter-cli
          # PEP 668 marks the runner's Python as externally managed, so a plain
          # `pip install` fails there. Try it first anyway, so this keeps
          # working on an image that has not adopted the marker.
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest

      - name: Run the matrix
        # The harness owns its own isolated NVIM_APPNAME and XDG root, so it
        # cannot touch a real config even on a runner.
        #
        # No TeX distribution is installed: it is gigabytes for one bundle, and
        # the harness gates every row on its toolchain, so latex reports
        # UNCOVERED here rather than failing. Its one real capability, the
        # compile, is covered by tests/behave_latex.lua.
        #
        # `pipefail` so a crash in the harness fails the step even though the
        # output is piped through tee.
        shell: bash
        run: |
          set -o pipefail
          bash tests/capability.sh "${{ inputs.language || '--all' }}" 2>&1 | tee capability.log

      # The matrix is the artifact worth keeping: it is the record of what the
      # distribution could actually do on a given day.
      - name: Publish the matrix
        if: always()
        run: |
          {
            echo '## Language capability matrix'
            echo
            echo '| language | checkpoints |'
            echo '| --- | --- |'
            grep '^MATRIX' capability.log 2>/dev/null \
              | sed 's/^MATRIX \([a-z]*\) /| `\1` | /; s/$/ |/' \
              || echo '| (no matrix rows; see the job log) | |'
          } >> "$GITHUB_STEP_SUMMARY"
