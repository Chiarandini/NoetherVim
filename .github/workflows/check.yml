name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LuaJIT
        # Match the runtime Neovim actually uses (and our .luarc.json target).
        # Plain lua5.1 rejects LuaJIT extensions like `goto continue` that the
        # codebase relies on; lua5.4 would parse most code but introduces its
        # own syntax (e.g. <const>) that drifts from runtime.
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Parse-check every .lua file
        # `luajit -b in out` saves bytecode (default raw type) -- writing to
        # /dev/null discards the output but still runs lex+parse+codegen, so
        # any syntax error fails non-zero. This matches the parser Neovim
        # actually uses to load these files at runtime.
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! luajit -b "$f" /dev/null 2>err; then
              echo "SYNTAX FAIL: $f"
              cat err
              fail=$((fail + 1))
            fi
          done < <(find lua -name '*.lua' -print0)
          echo "Syntax errors: $fail"
          exit "$fail"

  typecheck:
    name: lua-language-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run lua-language-server
        # v0 pins lua-language-server 3.7.4, which predates tuple type
        # syntax (`[string, string][]`, added in 3.8.0) and so rejects
        # annotations that editors accept.  v1 pins 3.13.6.  `directories`
        # is set explicitly because its default changed from `lua` to `.`
        # between the two majors.  `.` covers ftplugin/ and templates/ too,
        # not just lua/.
        uses: mrcjkb/lua-typecheck-action@v1
        with:
          configpath: ".luarc.json"
          checklevel: Warning
          directories: "."

  keymap-citations:
    name: notable keybindings still exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # docs/notable-keybindings.md is prose about specific keys, so unlike
      # the generated docs it cannot be diffed against its source. This is the
      # cheap half of that gate: every key the page shows a snippet for must
      # still be bound somewhere in lua/. It catches a binding being deleted
      # or moved to a different lhs, which is the drift that actually happens.
      # It cannot catch a binding whose behaviour changed while keeping its
      # key, and single-character keys are weak (another mapping can satisfy
      # the grep). Both are accepted: the alternative is no gate at all.
      #
      # Braces are stripped from both sides so that a `{ "n", "v" }` mode list
      # cannot be mistaken for the lhs, and so that the `, "<lhs>"` haystack
      # pattern matches on argument position rather than anywhere on the line.
      #
      # Matching is case-SENSITIVE, with one normalisation: the inside of
      # `<...>` is lowercased, because the page writes `<Right>` where the
      # source writes `<right>`. A blanket `grep -i` was tried first and is
      # wrong, since it lets `zx` (scroll view) satisfy a citation of `ZX`
      # (save-then-force-quit), and the Z grid is nine keys that all have a
      # lowercase homograph.
      - name: Every cited keymap is still bound
        run: |
          set -euo pipefail
          page=docs/notable-keybindings.md

          # perl rather than `sed \L`: same behaviour on the runner and on a
          # BSD-sed machine, so this is verifiable locally before it is pushed.
          # Runs of spaces after a comma collapse to one, because several core
          # keymap.set calls are column-aligned and would otherwise never match
          # the single-space `, "<lhs>"` needle.
          norm() {
            sed 's/{[^}]*}//g' | perl -pe 's/(<[^>]*>)/lc($1)/ge; s/,\s+/, /g'
          }

          haystack=$(grep -rh 'keymap\.set' lua/ | norm)

          # A here-string, not `printf | grep -q`. `grep -q` exits on its
          # first match and closes the pipe, so printf takes SIGPIPE; under
          # `pipefail` the pipeline then reports the write error rather than
          # grep's success, and `if !` reads that as "not bound". It only
          # fires when the haystack is large enough that printf is still
          # writing when grep leaves, which is why it passed locally and
          # failed on the runner, on whichever key happened to lose the race.
          missing=0
          while IFS= read -r lhs; do
            [ -n "$lhs" ] || continue
            if ! grep -qF -- ", \"$lhs\"" <<<"$haystack"; then
              echo "cited in $page but not bound in lua/: $lhs"
              missing=$((missing + 1))
            fi
          done < <(norm < "$page" |
                     sed -nE 's/.*vim\.keymap\.set\([^,]*,[[:space:]]*"([^"]+)".*/\1/p' |
                     sort -u)

          echo "unbound citations: $missing"
          exit "$missing"
