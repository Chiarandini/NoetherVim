name: docs

# The docs site lives in docs-site/ but is *served* from the personal site at
# nathanaelsrawley.com/noethervim/, built there by Chiarandini/website-nate's
# deploy workflow. This workflow does two things: prove the site still builds
# from this commit, and tell website-nate to rebuild.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "README.md"
      - ".github/workflows/docs.yml"
      # The bundle reference and the README's generated blocks are built from
      # the `@desc` / `@requires` annotations, so a bundle file is a docs
      # source. Without these, editing an annotation and pushing would skip
      # the run entirely, and the drift gate that exists to catch exactly
      # that would never fire.
      - "lua/noethervim/bundles/**"
      - "lua/noethervim/util/bundle_meta.lua"
      - "tools/gen-docs.lua"
  workflow_dispatch: {}

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # gen-docs.lua only reads files, so a bare Neovim is enough: no plugins,
      # no lazy sync.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Regenerating must be a no-op. If it is not, either an annotation
      # changed without the generated copies being refreshed, or someone
      # edited a generated file by hand. Both are drift, and both fail here.
      #
      # gen-docs.lua also exits non-zero on a malformed @requires line, so a
      # broken annotation cannot reach the site or :checkhealth.
      - name: Bundle reference is up to date
        run: |
          nvim --headless -l tools/gen-docs.lua
          git diff --exit-code -- README.md docs-site/src/content/docs/guides/bundles.md

      # Every bundle must declare its requirements, `---@requires none`
      # included, so "reviewed and has none" is distinguishable from
      # "nobody looked".
      - name: Every bundle declares requirements
        run: |
          missing=0
          for f in lua/noethervim/bundles/*/*.lua; do
            grep -q '^---@requires' "$f" || { echo "no @requires: $f"; missing=$((missing + 1)); }
            grep -q '^---@desc' "$f"     || { echo "no @desc: $f";     missing=$((missing + 1)); }
            grep -q '^---@about' "$f"    || { echo "no @about: $f";    missing=$((missing + 1)); }
          done
          echo "bundles missing annotations: $missing"
          exit "$missing"

      # Astro 7 declares engines.node >=22.12.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      # sync-docs.mjs regenerates src/content/docs/{start,guides} from the
      # repo's canonical markdown on every build. Those paths are gitignored,
      # so a clean tree here means the sync did not try to write anywhere it
      # should not have.
      - name: No stray generated files
        run: git diff --exit-code

  notify:
    name: trigger site rebuild
    needs: build
    runs-on: ubuntu-latest
    # Only the real repo should poke the deploy; forks would fail on the
    # missing secret anyway.
    if: github.repository == 'Chiarandini/NoetherVim'
    # The `secrets` context is not available in a step-level `if`, so the
    # token is mapped into `env` here and the step tests that instead.
    env:
      TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}

      # Repos to rebuild. `cs-ghi` is the one that currently holds
      # `cname: nathanaelsrawley.com`, so it is what actually serves the live
      # site; `Chiarandini` is the cutover target and is kept warm alongside
      # it. Dispatching to both means the docs are correct either side of the
      # switch.
      #
      # AFTER THE CUTOVER: drop `cs-ghi/website-nate` from this list. That is
      # the only change needed here; see DOMAIN-CUTOVER.md.
      TARGETS: cs-ghi/website-nate Chiarandini/website-nate

      # workflow_dispatch, not repository_dispatch. The latter only runs
      # workflows sitting on a repo's *default* branch, and cs-ghi's default
      # is `gh-pages`, which carries no workflows at all, so a
      # repository_dispatch there would be accepted and then silently do
      # nothing. workflow_dispatch takes an explicit ref.
      WORKFLOW: deploy.yml
      REF: archive
    steps:
      # GITHUB_TOKEN cannot trigger workflows in another repository, so this
      # needs a PAT with `actions: write` on the target repos, stored here as
      # DOCS_DISPATCH_TOKEN. Without the secret the step is skipped rather
      # than failed: the sites also rebuild on their own pushes, so docs are
      # never stranded for long.
      - name: Rebuild the sites that serve the docs
        if: env.TOKEN != ''
        run: |
          ok=0
          for repo in $TARGETS; do
            if curl -fsS -X POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer $TOKEN" \
                 "https://api.github.com/repos/$repo/actions/workflows/$WORKFLOW/dispatches" \
                 -d "{\"ref\":\"$REF\"}"; then
              echo "dispatched: $repo"
              ok=$((ok + 1))
            else
              echo "FAILED: $repo (token may lack access, or $REF/$WORKFLOW is missing)"
            fi
          done
          # One target succeeding is enough; the other may legitimately be
          # out of the token's reach. All of them failing is a real problem.
          if [ "$ok" -eq 0 ]; then
            echo "no target accepted the dispatch"
            exit 1
          fi
