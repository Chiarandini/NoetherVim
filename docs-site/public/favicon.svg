<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="NoetherVim">
  <title>NoetherVim</title>
  <!--
    A filled tile rather than a bare glyph, which is what makes this work on
    every browser chrome without a prefers-color-scheme rule. On a light tab
    the tile carries the mark (17:1 against white); on a dark tab the tile
    recedes into the chrome and the N reads on its own (12.8:1). Either way
    something is legible, so there is no second colour to keep in step.

    Drawn as filled geometry, not strokes. An N has two acute joins, where a
    mitre grows spikes past the glyph box and a square cap leaves notches at
    the outer corners; three overlapping filled shapes put every vertex under
    control and keep the outline inside its 9..23 by 8..24 box.
  -->
  <rect width="32" height="32" rx="7" fill="#1d1b24"/>
  <g fill="#f2f0f7">
    <rect x="9"  y="8" width="4" height="16"/>
    <rect x="19" y="8" width="4" height="16"/>
    <polygon points="9,8 13,8 23,24 19,24"/>
  </g>
</svg>
